<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalhes do Produto — Santa Rita - Casa dos Colchões</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    /* ===== PRODUTO PAGE — estilos exclusivos ===== */
    .prod-page {
      min-height: 100svh;
      background: var(--fundo-page);
    }

    /* Breadcrumb */
    .breadcrumb {
      padding: 14px 0;
      font-size: .82rem;
      color: var(--texto-muted);
      border-bottom: 1px solid var(--borda);
      background: var(--branco-puro);
    }
    .breadcrumb__inner {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .breadcrumb a {
      color: var(--azul-santa-rita);
      font-weight: 500;
      transition: opacity .2s;
    }
    .breadcrumb a:hover { opacity: .75; }
    .breadcrumb__sep { opacity: .4; }
    .breadcrumb__atual { color: var(--texto-secundario); }

    /* Layout principal do produto */
    .prod-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 40px;
      padding: 40px 0 64px;
    }
    @media (min-width: 860px) {
      .prod-layout {
        grid-template-columns: 1fr 1fr;
        gap: 56px;
        align-items: start;
      }
    }

    /* Galeria */
    .prod-galeria {
      position: sticky;
      top: 100px;
    }
    .prod-galeria__principal {
      width: 100%;
      aspect-ratio: 4/3;
      border-radius: var(--raio-lg);
      overflow: hidden;
      background: var(--fundo-cinza-claro);
      box-shadow: var(--sombra-md);
      margin-bottom: 16px;
    }
    .prod-galeria__principal img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .5s ease;
    }
    .prod-galeria__principal:hover img { transform: scale(1.04); }

    .prod-galeria__thumbs {
      display: flex;
      gap: 10px;
    }
    .prod-galeria__thumb {
      width: 72px;
      height: 72px;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color .2s;
      flex-shrink: 0;
      background: var(--fundo-cinza-claro);
    }
    .prod-galeria__thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .prod-galeria__thumb.ativo { border-color: var(--primary-red); }
    .prod-galeria__thumb:hover { border-color: var(--azul-santa-rita); }

    /* Badge flutuante de tag */
    .prod-galeria__wrap {
      position: relative;
    }
    .prod-tag-badge {
      position: absolute;
      top: 16px;
      left: 16px;
      background: var(--primary-red);
      color: var(--branco-puro);
      font-size: .75rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 99px;
      text-transform: uppercase;
      letter-spacing: .07em;
      z-index: 2;
    }

    /* Info do produto */
    .prod-info {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .prod-info__cat {
      font-size: .78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--azul-santa-rita);
      margin-bottom: 10px;
    }

    .prod-info__titulo {
      font-family: var(--fonte-display);
      font-size: clamp(1.6rem, 3.5vw, 2.4rem);
      font-weight: 700;
      color: var(--texto-principal);
      line-height: 1.2;
      margin-bottom: 20px;
    }

    /* Preços */
    .prod-info__precos {
      background: linear-gradient(135deg, #fff8f8 0%, #fff 100%);
      border: 1.5px solid rgba(220,38,38,.15);
      border-radius: var(--raio);
      padding: 20px 24px;
      margin-bottom: 24px;
    }
    .prod-info__avista {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--primary-red);
      line-height: 1;
      margin-bottom: 6px;
    }
    .prod-info__parcelado {
      font-size: .9rem;
      color: var(--texto-secundario);
    }
    .prod-info__parcelado strong { color: var(--texto-principal); }

    /* Densidade badge */
    .prod-densidade {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--azul-santa-rita);
      color: var(--branco-puro);
      font-size: .78rem;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 99px;
      margin-bottom: 20px;
    }

    /* Descrição */
    .prod-info__descricao {
      font-size: .95rem;
      color: var(--texto-secundario);
      line-height: 1.8;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--borda);
      padding-bottom: 24px;
    }

    /* Diferenciais */
    .prod-diferenciais {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }
    .prod-diferencial {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .85rem;
      color: var(--texto-secundario);
      background: var(--fundo-page);
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--borda);
    }
    .prod-diferencial svg { color: #16A34A; flex-shrink: 0; }

    /* Ficha técnica */
    .prod-ficha {
      margin-bottom: 28px;
    }
    .prod-ficha__titulo {
      font-size: .82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--texto-muted);
      margin-bottom: 14px;
    }
    .prod-ficha__grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      border: 1px solid var(--borda);
      border-radius: var(--raio);
      overflow: hidden;
    }
    .prod-ficha__item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--borda);
      border-right: 1px solid var(--borda);
    }
    .prod-ficha__item:nth-child(even) { border-right: none; }
    .prod-ficha__item:nth-last-child(-n+2) { border-bottom: none; }
    .prod-ficha__chave {
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--texto-muted);
      margin-bottom: 3px;
    }
    .prod-ficha__valor {
      font-size: .88rem;
      font-weight: 600;
      color: var(--texto-principal);
    }

    /* Ações */
    .prod-acoes {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .prod-acoes .btn {
      width: 100%;
      justify-content: center;
      padding: 16px 24px;
      font-size: 1rem;
    }

    /* Garantias strip */
    .prod-garantias {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      padding: 20px 0;
      border-top: 1px solid var(--borda);
      margin-top: 24px;
    }
    .prod-garantia {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .8rem;
      color: var(--texto-secundario);
    }
    .prod-garantia svg { color: var(--azul-santa-rita); }

    /* Seção produtos relacionados */
    .prod-relacionados {
      padding: 56px 0 80px;
      background: var(--fundo-page);
      border-top: 1px solid var(--borda);
    }

    /* Skeleton */
    .prod-skeleton {
      padding: 56px 0;
    }
    .prod-skeleton .skeleton-bloco {
      background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: skeleton-anim 1.4s infinite;
      border-radius: var(--raio);
    }
    @keyframes skeleton-anim {
      from { background-position: 200% 0; }
      to   { background-position: -200% 0; }
    }

    /* Erro */
    .prod-erro {
      text-align: center;
      padding: 80px 24px;
    }
    .prod-erro h2 {
      font-family: var(--fonte-display);
      font-size: 1.8rem;
      margin-bottom: 12px;
      color: var(--texto-principal);
    }
    .prod-erro p {
      color: var(--texto-secundario);
      margin-bottom: 28px;
    }

    /* WhatsApp btn especial */
    .btn--whatsapp {
      background: #25D366;
      color: #fff;
      border-color: #25D366;
    }
    .btn--whatsapp:hover, .btn--whatsapp:focus-visible {
      background: #1EBE59;
      border-color: #1EBE59;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37,211,102,.35);
    }

    /* Responsivo mobile - galeria não sticky */
    @media (max-width: 859px) {
      .prod-galeria { position: static; }
    }
  </style>
</head>

  <script>
    'use strict';

    const WHATSAPP = '5599701-7188';
    const FOTO_VAZIA = 'https://placehold.co/900x675?text=Sem+foto';

    const CATS_NOMES = {
      colchao: 'Colchões', cama: 'Cama', sofa: 'Sofá', cabeceira: 'Cabeceira',
      puff: 'Puff', travesseiro: 'Travesseiro', almofada: 'Almofada', poltrona: 'Poltrona',
    };

    const formatarPreco = (v) =>
      new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v);

    /* evita que texto cadastrado quebre o HTML da página */
    const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    /* Linha da tabela "produtos" do Supabase → formato usado nesta página */
    const mapearProduto = (p) => {
      const galeria = Array.isArray(p.imagens) ? p.imagens.filter(Boolean) : [];
      const principal = p.imagem || galeria[0] || '';
      return {
        id: p.id,
        titulo: p.titulo || 'Produto',
        categoria: p.categoria,
        catNome: CATS_NOMES[p.categoria] || p.categoria || 'Produto',
        preco: Number(p.preco) || 0,
        tag: p.tag || null,
        densidade: p.densidade || null,
        imagens: [...new Set([principal, ...galeria].filter(Boolean))],
        descricao: p.descricao || '',
        specs: {
          ...(p.especificacoes ? { 'Tecnologia': p.especificacoes } : {}),
          ...(p.densidade ? { 'Densidade': p.densidade } : {}),
        },
      };
    };

    async function buscarProduto(id) {
      if (!id) return null;
      const { data, error } = await supabaseClient
        .from('produtos').select('*').eq('id', id).maybeSingle();
      if (error) { console.error('Erro ao buscar produto:', error); return null; }
      return data ? mapearProduto(data) : null;
    }

    async function buscarRelacionados(produto) {
      if (!produto.categoria) return [];
      const { data, error } = await supabaseClient
        .from('produtos').select('*')
        .eq('categoria', produto.categoria).neq('id', produto.id)
        .order('id', { ascending: false }).limit(4);
      if (error) { console.error('Erro ao buscar relacionados:', error); return []; }
      return (data || []).map(mapearProduto);
    }

    const ICONE_WHATS = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893A11.821 11.821 0 0020.893 3.488"/></svg>';

    function renderizarProduto(produto) {
      const fotos = produto.imagens.length ? produto.imagens : [FOTO_VAZIA];

      const specsHTML = Object.entries(produto.specs).map(([k, v]) => `
        <div class="prod-ficha__item">
          <div class="prod-ficha__chave">${esc(k)}</div>
          <div class="prod-ficha__valor">${esc(v)}</div>
        </div>`).join('');

      const fichaHTML = specsHTML ? `
        <div class="prod-ficha">
          <div class="prod-ficha__titulo">Ficha Técnica</div>
          <div class="prod-ficha__grid">${specsHTML}</div>
        </div>` : '';

      const densidadeHTML = produto.densidade ? `
        <div class="prod-densidade">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6M9 12h6M9 15h4"/></svg>
          Densidade: ${esc(produto.densidade)}
        </div>` : '';

      const descricaoHTML = produto.descricao
        ? `<p class="prod-info__descricao" style="white-space:pre-line">${esc(produto.descricao)}</p>` : '';

      const thumbsHTML = fotos.length > 1 ? `
        <div class="prod-galeria__thumbs" role="list" aria-label="Outras fotos do produto" style="flex-wrap:wrap">
          ${fotos.map((src, i) => `
            <div class="prod-galeria__thumb${i === 0 ? ' ativo' : ''}" role="listitem" tabindex="0"
                 data-src="${esc(src)}" aria-label="Ver foto ${i + 1}">
              <img src="${esc(src)}" alt="${esc(produto.titulo)} — foto ${i + 1}" loading="lazy" />
            </div>`).join('')}
        </div>` : '';

      const msgWA = encodeURIComponent(
        `Olá! Vi o produto *${produto.titulo}* no site de vocês e gostaria de mais informações e disponibilidade de estoque. Preço: ${formatarPreco(produto.preco)}`);
      const msgCompraWA = encodeURIComponent(
        `Olá! Quero comprar o *${produto.titulo}* (${formatarPreco(produto.preco)}). Podem me ajudar com as formas de pagamento e prazo de entrega?`);

      return `
        <div class="prod-layout">
          <div class="prod-galeria">
            <div class="prod-galeria__wrap">
              ${produto.tag ? `<div class="prod-tag-badge">${esc(produto.tag)}</div>` : ''}
              <div class="prod-galeria__principal" id="galeria-principal">
                <img src="${esc(fotos[0])}" alt="${esc(produto.titulo)}" width="900" height="675" id="img-principal"
                     onerror="this.onerror=null;this.src='${FOTO_VAZIA}'" />
              </div>
            </div>
            ${thumbsHTML}
          </div>

          <div class="prod-info">
            <div class="prod-info__cat">${esc(produto.catNome)}</div>
            <h1 class="prod-info__titulo">${esc(produto.titulo)}</h1>
            ${densidadeHTML}
            <div class="prod-info__precos">
              <div class="prod-info__avista">${formatarPreco(produto.preco)}</div>
              <div class="prod-info__parcelado">
                ou <strong>10× de ${formatarPreco(produto.preco / 10)}</strong> sem juros no cartão
              </div>
            </div>
            ${descricaoHTML}
            ${fichaHTML}

            <div class="prod-acoes">
              <a href="https://wa.me/${WHATSAPP}?text=${msgCompraWA}" class="btn btn--primario"
                 target="_blank" rel="noopener" aria-label="Comprar ${esc(produto.titulo)} via WhatsApp">
                ${ICONE_WHATS} Comprar via WhatsApp
              </a>
              <a href="https://wa.me/${WHATSAPP}?text=${msgWA}" class="btn btn--whatsapp" target="_blank" rel="noopener">
                ${ICONE_WHATS.replace('width="20" height="20"', 'width="18" height="18"')} Tirar Dúvidas no WhatsApp
              </a>
              <a href="index.html#vitrine" class="btn btn--outline-dark">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
                Ver mais produtos
              </a>
            </div>

            <div class="prod-garantias">
              <div class="prod-garantia">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                Produto Certificado
              </div>
              <div class="prod-garantia">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
                Entrega Grátis na Cidade
              </div>
              <div class="prod-garantia">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                Troca em 30 dias
              </div>
              <div class="prod-garantia">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
                10× sem juros
              </div>
            </div>
          </div>
        </div>`;
    }

    const HTML_ERRO = `
      <div class="prod-erro">
        <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:#E5E7EB;margin:0 auto 20px"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <h2>Produto não encontrado</h2>
        <p>O produto que você procura não existe ou foi removido do catálogo.</p>
        <a href="index.html#vitrine" class="btn btn--primario">Ver Catálogo Completo</a>
      </div>`;

    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('ano-footer').textContent = new Date().getFullYear();
      window.scrollTo(0, 0);

      const skeleton = document.getElementById('prod-skeleton');
      const conteudo = document.getElementById('prod-conteudo');
      const relacionadosWrap = document.getElementById('prod-relacionados');

      const produtoId = new URLSearchParams(window.location.search).get('id');
      const produto = await buscarProduto(produtoId);

      skeleton.hidden = true;
      conteudo.hidden = false;

      if (!produto) {
        conteudo.innerHTML = HTML_ERRO;
        document.getElementById('breadcrumb-nome').textContent = 'Não encontrado';
        return;
      }

      document.title = `${produto.titulo} — Santa Rita - Casa dos Colchões`;
      document.querySelector('meta[name="description"]').content =
        `${produto.titulo} por ${formatarPreco(produto.preco)}. ${produto.descricao.substring(0, 120)}`;
      document.getElementById('breadcrumb-nome').textContent = produto.titulo;

      conteudo.innerHTML = renderizarProduto(produto);

      /* troca de foto na galeria */
      conteudo.querySelectorAll('.prod-galeria__thumb').forEach((thumb) => {
        const trocar = () => {
          document.getElementById('img-principal').src = thumb.dataset.src;
          conteudo.querySelectorAll('.prod-galeria__thumb').forEach((t) => t.classList.remove('ativo'));
          thumb.classList.add('ativo');
        };
        thumb.addEventListener('click', trocar);
        thumb.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); trocar(); }
        });
      });

      /* produtos relacionados (mesma categoria) */
      const relacionados = await buscarRelacionados(produto);
      if (relacionados.length) {
        relacionadosWrap.hidden = false;
        document.getElementById('prod-relacionados-grid').innerHTML = relacionados.map((p) => `
          <article class="produto-card" role="listitem" style="cursor:pointer"
                   onclick="window.location.href='produto.html?id=${encodeURIComponent(p.id)}'"
                   aria-label="${esc(p.titulo)} — ${formatarPreco(p.preco)}">
            <div class="produto-card__img-wrap">
              <img src="${esc(p.imagens[0] || FOTO_VAZIA)}" alt="${esc(p.titulo)}" loading="lazy" width="600" height="450"
                   onerror="this.onerror=null;this.src='${FOTO_VAZIA}'" />
              ${p.tag ? `<span class="produto-card__tag">${esc(p.tag)}</span>` : ''}
            </div>
            <div class="produto-card__corpo">
              <p class="produto-card__cat">${esc(p.catNome)}</p>
              <h3 class="produto-card__titulo">${esc(p.titulo)}</h3>
              <div class="produto-card__precos">
                <div class="produto-card__avista">${formatarPreco(p.preco)}</div>
                <div class="produto-card__parcelado">ou 10× de ${formatarPreco(p.preco / 10)} sem juros</div>
              </div>
              <div class="produto-card__ver" aria-hidden="true">
                Ver detalhes
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
              </div>
            </div>
          </article>`).join('');
      }
    });
  </script>
</body>
</html>
