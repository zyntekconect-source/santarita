<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Redefinir senha | Santa Rita</title>
  <link rel="icon" href="logo-aba.png" type="image/png" sizes="32x32">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #172b4d;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 35px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 35px rgba(0, 0, 0, 0.08);
    }

    .logo {
      display: block;
      width: 180px;
      max-width: 70%;
      height: auto;
      margin: 0 auto 24px;
    }

    h1 {
      margin-top: 0;
      font-size: 27px;
    }

    p {
      color: #64748b;
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #1e4d8c;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #mensagem {
      margin-top: 18px;
      overflow-wrap: anywhere;
    }

    .voltar {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #1e4d8c;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <main class="card">
    <a href="index.html" aria-label="Santa Rita - Casa dos Colchões, ir para a página inicial">
      <img class="logo" src="logo-nav.png" alt="Santa Rita - Casa dos Colchões">
    </a>

    <h1>Redefinir senha</h1>

    <p>
      Escolha uma nova senha para acessar sua conta
      da Santa Rita — Casa dos Colchões.
    </p>

    <form id="form-redefinir">
      <label for="nova-senha">Nova senha</label>

      <input
        type="password"
        id="nova-senha"
        minlength="8"
        autocomplete="new-password"
        placeholder="Digite sua nova senha"
        required
      >

      <label for="confirmar-senha">Confirmar nova senha</label>

      <input
        type="password"
        id="confirmar-senha"
        minlength="8"
        autocomplete="new-password"
        placeholder="Digite novamente"
        required
      >

      <button type="submit" id="btn-salvar">
        Salvar nova senha
      </button>
    </form>

    <p id="mensagem" role="status" aria-live="polite"></p>

    <a href="login.html" class="voltar">
      Voltar para o login
    </a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <script>
    const formulario = document.getElementById('form-redefinir');
    const mensagem = document.getElementById('mensagem');
    const botao = document.getElementById('btn-salvar');

    // Confirma que o link recebido criou uma sessão válida.
    async function verificarSessao() {
      try {
        const { data, error } =
          await supabaseClient.auth.getSession();

        if (error || !data.session) {
          mensagem.textContent =
            'Link inválido ou expirado. Solicite um novo e-mail de recuperação.';

          formulario.hidden = true;
          return;
        }

        formulario.hidden = false;

      } catch (error) {
        console.error(error);

        mensagem.textContent =
          'Não foi possível validar o link. Tente solicitar outro.';
        formulario.hidden = true;
      }
    }

    formulario.addEventListener('submit', async (event) => {
      event.preventDefault();

      const senha = document.getElementById('nova-senha').value;
      const confirmacao =
        document.getElementById('confirmar-senha').value;

      if (senha.length < 8) {
        mensagem.textContent =
          'A senha precisa ter pelo menos 8 caracteres.';
        return;
      }

      if (senha !== confirmacao) {
        mensagem.textContent = 'As senhas não coincidem.';
        return;
      }

      botao.disabled = true;
      botao.textContent = 'Salvando...';
      mensagem.textContent = '';

      try {
        const { error } = await supabaseClient.auth.updateUser({
          password: senha
        });

        if (error) {
          throw error;
        }

        mensagem.textContent =
          'Senha alterada com sucesso! Você já pode entrar com a nova senha.';

        formulario.reset();
        formulario.hidden = true;

      } catch (error) {
        console.error('Erro ao redefinir senha:', error);

        mensagem.textContent =
          'Não foi possível alterar a senha. Solicite um novo link se necessário.';

      } finally {
        botao.disabled = false;
        botao.textContent = 'Salvar nova senha';
      }
    });

    verificarSessao();
  </script>

</body>
</html>
